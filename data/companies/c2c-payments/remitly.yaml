notable_facts: "FY2024 revenue $1.18B (Nasdaq: RELY annual report), up from $841M
  FY2023. GAAP net loss — investing aggressively in growth; adjusted EBITDA positive.
  Founded by Matt Oppenheimer, Josh Hug, and Shivaas Gulati in Seattle. Primary
  product: consumer remittances from USA, Canada, UK, EU to 170+ destination countries.
  Top corridors: USA to Philippines, Mexico, India, Guatemala, Colombia. 7M+ customers
  globally. Remitly's structural positioning: unlike Wise (which serves larger
  business and personal transfers at mid-market FX rates), Remitly specifically
  targets immigrant workers sending smaller amounts frequently ($200-500 per transfer)
  with speed guarantees (some transfers in minutes). Speed guarantee is the primary
  differentiator — users pay more for a 'within minutes' promise vs waiting for
  next-day bank transfer. This speed premium is the margin mechanism. GAAP loss
  reflects heavy investment in corridor expansion and customer acquisition; underlying
  unit economics positive at established corridor level per company disclosure.
  Evidence weight: weak_validator — public company (high signal confidence) but GAAP
  loss-making (unproven at aggregate economics level)."
