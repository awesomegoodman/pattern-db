notable_facts: "Founded in Lagos by Idorenyin Obong and Joseph Femi Aghedo. Core
  product: virtual USD, GBP, and EUR accounts for African professionals — enabling
  Nigerian freelancers, remote workers, and creators to receive international payments
  without the friction of Nigerian bank international accounts (which require extensive
  documentation, are frequently frozen, and have low USD transfer limits under CBN
  regulations). Primary use case: Nigerian software developers, designers, and writers
  working for international clients via Upwork, Toptal, Fiverr, and direct contracts
  who need a reliable USD account to receive payment. Structurally distinct from
  LemFi: Grey solves the receive-side problem (getting foreign currency into a stable
  account) rather than the send-side remittance problem (sending money home). Grey
  users hold USD and convert to NGN at official or parallel rates as needed. This
  is a direct consequence of Nigeria's FX controls: the official exchange rate
  creates a gap that makes holding USD preferable to immediate conversion. 200,000+
  users. Thin data: seed-stage, minimal public disclosure — many MVR fields are Unknown."
