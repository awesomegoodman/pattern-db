slug: gcash
name: GCash (Mynt)
domain: c2c-payments
research_queue_source: "OFF_QUEUE:foundation-record"
founded: 2004
country: Philippines
status: operating
stage: unicorn
funding_history: "Launched 2004 by Globe Telecom as a mobile money product. Spun out
  into Mynt (Globe Fintech Innovations) in 2015. Series A: Ant Group invested 2021
  ($175M at $1B+ valuation — unicorn). Series B: $300M 2022 at $2B valuation (Warburg
  Pincus, Bow Wave Capital, Amplo, Globe Telecom, Ant Group). Total: $475M+ raised
  as Mynt. Globe Telecom retains majority ownership."
revenue_signal: ">100M"
profitability_signal: known_profitable
evidence_weight: strong_validator
signal_confidence: high
notable_facts: "GCash profitable from 2022 — CEO Martha Sazon stated profitable three years ahead of plan. 2023 net income PHP 6.7B (~$115M) per Globe Telecom annual report. 94M+ registered users. PHP 1.5 trillion total transaction value. $5B valuation after MUFG acquired 8% stake for $393M August 2024. Mynt filed IPO prospectus June 2026 on Philippine Stock Exchange.
  Products: P2P transfer, bills payment, GSave (deposits), GInvest (mutual funds),
  GLoan, QR payments. Ant Group's 2021 investment was strategic: GCash adopted
  Alipay's technical infrastructure and product playbook for the Philippine market.
  Structural parallel to M-Pesa: Globe Telecom's existing subscriber base and airtime
  distribution network provided zero-CAC distribution at launch. Key difference from
  M-Pesa: Philippines had higher smartphone penetration at launch — GCash is primarily
  app-based rather than USSD/SMS-based. Fills domestic-payment-infrastructure with a
  Southeast Asia strong validator. Natural experiment vs M-Pesa: similar telco-owned
  model, different market conditions (higher banked population, higher smartphone
  penetration), similar outcome (dominant market position). Validates the model
  transfers across different starting conditions."
