problems:
  - slug: c2c-international-remittance
timeline:
  - year: 2004
    event_type: founding
    implementation_pattern: mobile-money-network
    problem: c2c-international-remittance
    description: "Launched by Globe Telecom as SMS-based mobile money service. Initial
      use case: airtime transfer and bill payment. P2P money transfer added as primary
      use case when users demonstrated demand by using airtime transfer as a money proxy
      — identical origin story to M-Pesa Kenya three years later."
    source: Globe Telecom company history / GCash product history
  - year: 2015
    event_type: pivot
    implementation_pattern: mobile-money-network
    description: "Globe Telecom spun GCash out into Mynt (Globe Fintech Innovations)
      as a separate entity. Pivot from USSD/SMS to app-first model as Philippine
      smartphone penetration reached critical mass. This pivot is the structural
      fork from M-Pesa's model: M-Pesa remained USSD-first because Kenya's smartphone
      penetration was lower; GCash moved to app-first."
    source: Globe Telecom 2015 Annual Report / Mynt incorporation documents
  - year: 2021
    event_type: funding
    implementation_pattern: mobile-money-network
    description: "Ant Group invested at $1B+ valuation. GCash adopted Alipay technical
      infrastructure — payment QR standard, credit scoring model, financial product
      distribution layer. 55M users at time of investment. Ant investment was strategic:
      GCash became Alipay's primary vehicle for Philippine market entry without requiring
      Ant to obtain a Philippine e-money licence directly."
    capability_acquired: "Alipay technical infrastructure and credit scoring models —
      enabled GInvest, GLoan, and GSave product launches within 12 months of investment."
    source: Mynt Series A announcement / Globe Telecom 2021 Annual Report
  - year: 2022
    event_type: product_launch
    implementation_pattern: mobile-money-network
    description: "First full profitable year declared in Globe Telecom annual report.
      $300M Series B 2022 ($2B valuation at time); valuation rose to $5B by August 2024 after MUFG investment. 66M users. $60B+ gross transaction value.
      Profitability achieved via financial services revenue (GInvest, GLoan) layered
      on top of P2P transfer base — same financial services expansion trajectory
      as M-Pesa GlobalPay and Gusto Cash Accounts."
    source: Globe Telecom 2022 Annual Report / Mynt Series B announcement
