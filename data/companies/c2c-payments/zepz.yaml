funding_history: "WorldRemit founded 2010 by Ismail Ahmed (Somali-British). Raised
  $400M+ (Accel, TCV, Leapfrog Investments). Sendwave founded 2014, raised $25M.
  WorldRemit acquired Sendwave for $500M in 2021. Combined entity Zepz raised
  $292M in 2021 at $5B valuation (Leapfrog Investments, TCV, Accel). Total raised:
  $700M+ combined. Significant layoffs: 420 staff (26%) December 2021, additional
  rounds 2022-2023."
