evidence_weight: weak_validator
signal_confidence: low
notable_facts: "WorldRemit founded by Ismail Ahmed in London — a Somali-British
  entrepreneur who had direct personal experience of the high cost of international
  remittances (his family in Somaliland depended on diaspora remittances). Initial
  product: low-cost international transfers from UK to Africa and Asia. Sendwave
  (acquired 2021, $500M) was focused specifically on Sub-Saharan Africa corridors.
  Combined entity Zepz processes $5B+ in annual transfer volume, 5M+ customers,
  140+ countries. The 420-person layoff (26% of workforce) in December 2021 — the
  same month the Zepz rebrand and $292M raise were announced — is an unusual signal
  of financial stress at peak funding. Additional layoffs in 2022 and 2023. Evidence
  weight: weak_validator — large scale and well-documented, but GAAP profitability
  unconfirmed and significant workforce reductions suggest unit economics remain
  challenging. Structural insight: the WorldRemit/Sendwave merger reflects the same
  consolidation dynamic seen across the cross-border payment space — scale is required
  for economics to work, driving M&A as an alternative to organic scale."
