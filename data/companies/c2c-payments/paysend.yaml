notable_facts: "Founded by Ronald Millar and Dmitry Avdeev. 7M+ customers, 170+
  countries, 40+ currencies. Primary product: flat-fee cross-border card-to-card
  transfer ($2 flat fee per transfer regardless of amount — structural differentiator
  from percentage-based competitors). The flat fee model is a deliberate structural
  bet: at high transfer amounts, $2 flat fee is dramatically cheaper than Wise's
  0.45% FX fee; at low amounts, it is more expensive. This implies Paysend is
  targeting higher-ticket diaspora transfers (e.g. rent, tuition) rather than
  frequent low-value transfers. Card-to-card rather than bank-to-bank is also
  structurally distinct from Wise and Remitly — recipients do not need a bank account,
  only a debit card, which extends reach to partially-banked populations.
  Profitability proxy applied: no external funding since 2021 + 7 years operating.
  Signal confidence Low. Fills IMPLEMENTATION_FILL on cross-border-a2a-infrastructure
  with a flat-fee pricing variant not otherwise represented in the dataset."
