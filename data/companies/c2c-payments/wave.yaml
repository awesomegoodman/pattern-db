notable_facts: "Founded by Drew Durbin and Ben Lyon in Dakar, Senegal — both
  ex-Google employees who had worked on Android and Google Pay. Core product: free
  mobile money transfers for West Africa. Revenue model: charges merchants 1% on
  payments received (vs. competitor telcos charging 4-7% for MTN Money and Orange
  Money), earns interest on float. 7M+ users across Senegal, Côte d'Ivoire, Mali,
  Cameroon, Uganda. Strategic insight: mobile money penetration in West Africa is
  high but existing services (telco-operated MTN Money, Orange Money) charge high
  fees and offer poor UX. Wave offers free consumer transfers, creating adoption
  through the consumer side and then charging merchants a lower rate than competitors.
  Stripe investment (2022) signals Stripe's direct interest in West African payment
  infrastructure — consistent with the Paystack acquisition (Nigeria, 2020). Fourth
  observation for local-rail-aggregation, first from Francophone West Africa. Distinct
  from Flutterwave and dLocal: Wave operates at the consumer adoption layer (mobile
  money wallet) rather than the merchant API layer — it builds the payment rail
  itself rather than aggregating existing rails. This is closer to domestic-payment-
  infrastructure than pure local-rail-aggregation, but the West African context
  (aggregating across BCEAO-regulated mobile money in multiple Francophone African
  countries) maps better to local-rail-aggregation."
