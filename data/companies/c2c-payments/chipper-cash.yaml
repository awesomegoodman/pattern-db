notable_facts: "Founded by Ham Serunjogi and Maijid Moujaled — both Ugandan, met
  at Grinnell College (Iowa). Core product: fee-free peer-to-peer cross-border money
  transfers within Africa (Ghana, Uganda, Nigeria, Kenya, South Africa, Tanzania,
  Rwanda) and from USA/UK to Africa. Had significant challenges in 2022-2023.
  FTX DOUBLE IMPACT: FTX was simultaneously a Chipper Cash investor (Series C) AND
  a partner (Chipper Cash added crypto trading via FTX partnership). When FTX
  collapsed in November 2022, Chipper Cash lost both its most recent strategic
  investor AND its primary crypto revenue stream simultaneously. June 2022: laid off
  50% of workforce (before FTX collapse — suggesting pre-existing financial stress).
  2023: additional layoffs, significantly reduced scale. Still operating as of 2025
  but dramatically smaller than 2021 peak. Evidence weight: weak_validator — company
  still operating but with severe distress signals. Not cleanly disconfirming (not
  shut down, no acquisition) but not a success case either. The FTX investment is
  the most analytically interesting fact: strategic investors who are themselves
  financially unsound create downstream instability in the companies they invest in —
  a tail risk not captured by standard funding history metrics."
