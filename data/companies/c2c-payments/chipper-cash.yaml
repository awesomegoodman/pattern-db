timeline:
  - year: 2018
    event_type: founding
    implementation_pattern: cross-border-a2a-infrastructure
    problem: c2c-international-remittance
    description: "Founded in San Francisco by Ham Serunjogi and Maijid Moujaled.
      Core insight: Africans in different countries cannot easily send money to each
      other — there is no pan-African payment network. SWIFT is expensive and slow;
      mobile money networks (MTN, Airtel) are country-specific. Chipper Cash built
      an app enabling free P2P transfers across 7 African countries using local
      mobile money and bank rails per country."
    source: TechCrunch / Chipper Cash company history
  - year: 2021
    event_type: funding
    description: "Series C $250M at $2B valuation. FTX Ventures invested as strategic
      partner — Chipper Cash planned to integrate crypto trading and cross-border
      crypto payments via FTX infrastructure. At this point: 5M+ registered users,
      intra-Africa transfers in 7 countries, USA-to-Africa launched."
    source: TechCrunch Series C announcement
  - year: 2022
    event_type: pivot
    description: "June 2022: laid off 50% of workforce. November 2022: FTX collapsed.
      Chipper Cash lost FTX as both investor and crypto infrastructure partner.
      Additional layoffs in 2023. Company continued operating with significantly
      reduced scale and team. The FTX connection created dual exposure: investor
      collapse + product partner collapse simultaneously."
    source: TechCrunch / Axios
