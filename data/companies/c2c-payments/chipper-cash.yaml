funding_history: "Series A $13.8M 2020. Series B $30M 2020 (same year). Series B
  extension $100M November 2020 (Bezos Expeditions, Ribbit Capital, SVB Capital).
  Series C $250M November 2021 at $2B valuation — FTX Ventures as strategic investor
  alongside Bezos Expeditions, Ribbit Capital. Total raised: $305M."
