funding_history: "Founded 2004 with minimal external capital. Apis Partners (London-
  based PE, Africa-focused) invested in 2019 — first significant external capital
  after 15 years of bootstrapped operation. Apis Partners follow-on 2022. Total
  external raised: undisclosed but estimated $30-50M range. The 15-year bootstrapped
  period is the primary economic signal."
