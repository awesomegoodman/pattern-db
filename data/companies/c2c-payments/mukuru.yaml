notable_facts: "Founded in Zimbabwe by Andrew Jury. 20+ years of continuous operation.
  Profitability proxy applied: no external capital for 15 years (2004-2019) before
  Apis Partners invested — Tier 6 inference, strong signal. Primary corridors: Zimbabwe
  diaspora in South Africa and UK sending remittances home to Zimbabwe. Expanded to
  15 African countries. Products: cash pickup, mobile money delivery, bank transfer.
  Unique corridor dominance: Zimbabwe has one of the largest diaspora communities
  relative to population in Africa (driven by economic crisis and emigration of
  2000s), creating structural demand for reliable remittance infrastructure. Mukuru
  built the dominant remittance corridor between South Africa and Zimbabwe — a
  market too small and operationally complex for global players like Wise to serve
  profitably at early stage. Fourth strong validator for cross-border-a2a-infrastructure
  (Wise, OFX, Payoneer, Mukuru) — pattern now has 4 strong validators across
  4 continents, triggering FAILURE_CASE_NEEDED on next queue run."
