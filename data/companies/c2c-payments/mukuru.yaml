    description: "Founded in Zimbabwe by Andrew Jury to serve the Zimbabwe diaspora
      in South Africa — at the time the primary economic migration corridor as Zimbabwe's
      economy collapsed. Initial product: cash remittances via agent network, enabling
      Zimbabwean workers in South Africa to send money home reliably when banks were
      not functioning normally."
    source: Mukuru company history / Apis Partners
  - year: 2014
    event_type: product_launch
    implementation_pattern: cross-border-a2a-infrastructure
    description: "Launched Mukuru.com — online remittance platform extending the
      agent-based model to digital channels. Expanded from Zimbabwe-South Africa
      corridor to Zimbabwe-UK corridor. At this point: 15+ years of self-sustaining
      operation. Growing into Zambia, Malawi, Mozambique corridors."
    source: Mukuru press materials
  - year: 2019
    event_type: funding
    description: "Apis Partners (Africa-focused PE, London) invested — first external
      capital after 15 years of bootstrapped operation. Investment used for geographic
      expansion and technology modernisation. Expanded to 15 African countries.
      The decision to raise after 15 profitable years rather than out of necessity
      is the same signal as Spreedly (bootstrapped 13 years then raised from Silversmith)."
    source: Apis Partners investment announcement
