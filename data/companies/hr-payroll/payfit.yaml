notable_facts: "Founded 2015 Paris by Firmin Zocchetto Ghislain de Fontenay Florian Fournier. Latka estimates $155M ARR
  2024 (up from $105M 2023). Unicorn EUR 1.82B 2022. 15,000+ SME customers across France Germany Spain UK. France-first
  positioning: French payroll is the most complex in Europe (Global Payroll Complexity Index ranks it #1). This
  complexity is a structural moat identical to Japan for SmartHR — global vendors fail to localise adequately, creating
  durable opening for native-first operators. Expanded to Germany (second-most-complex payroll in Europe) Spain UK.
  2024: opened New York office for US market entry. Target: SMEs 10-500 employees. Positioning as Workday for European
  SMEs same framing as Personio — two companies with near-identical positioning competing in adjacent but overlapping
  European SME markets."
