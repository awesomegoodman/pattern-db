notable_facts: "Founded 2019 Nairobi Kenya by Paul Kimani CEO and Jackson Kibigo Kungu COO. YC W20. Serves two ICP
  segments: (1) local businesses 20-100 employees single jurisdiction; (2) cross-border businesses 100-1000 employees
  multi-country. 1,000+ businesses across 20 African countries. Revenue grew 1.5x H1 2024. Notable investor: Visa
  (strategic) via Visa accelerator program — payment rail signal. Key insight from CEO: each African country has
  distinct payroll regulations — Ivory Coast payroll differs from South Africa payroll, making pan-African compliance a
  genuine technical moat not replicable by global players quickly. Added EOR services in addition to payroll. Stated
  goal: reach profitability as milestone (Series A announcement language)."
