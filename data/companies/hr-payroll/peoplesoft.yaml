notable_facts: "Founded by Dave Duffield and Ken Morris in Walnut Creek, CA. Became the dominant on-premise HCM and ERP
  vendor by the 1990s, displacing earlier mainframe-based systems. Peak: $1.3B annual revenue, 13,000 employees, 5,100
  customers. Failure mechanism: could not transition to cloud delivery without cannibalising perpetual licence and
  maintenance revenue (17-22% of licence, annually recurring). Oracle hostile takeover (resisted for 18 months)
  completed December 2005 at $10.3B. Dave Duffield and Aneel Bhusri (SVP Strategy at PeopleSoft) founded Workday in 2005
  explicitly as the cloud-native replacement. This makes PeopleSoft the canonical empirical ground for the cloud HCM
  winning condition: incumbent lock-in creating the structural opening that cloud-native entrants exploited.
  DISCONFIRMING for on-premise enterprise HCM pattern (IP-007). CONFIRMING for cloud enterprise HCM winning condition."
