notable_facts: "Founded 2015 Chaitanya Peddi Jayant Paleti Rohit Chennamaneni Hyderabad India. Latka $100M revenue 2025.
  FY2025 operating revenue INR 533.9 crore (~$64M) per filings (50% growth). Unicorn 2022. 550+ enterprise customers
  1.5M+ users. Investors: Microsoft Salesforce Ventures Sequoia TCV Peak XV Lightspeed KKR. Key structural
  differentiation: mobile-first for deskless workers. In India Southeast Asia Middle East most corporate workers are
  field staff (delivery retail manufacturing). Legacy HR software requires desktop and high bandwidth — unusable for
  field staff. Darwinbox lightweight mobile app on low-end smartphones and low-connectivity networks allowed large
  enterprises in retail logistics hospitality to digitise entire workforce. Clients: Starbucks Dominos Swiggy Kotak LuLu
  Group. Expanding US MENA. Competing directly with Workday SAP Oracle in Asia-Pacific."
