notable_facts: "Founded 2012 Dubai UAE by Brian Habibi Tarek Bayaa Talal Bayaa. 3,000+ companies in UAE expanding to
  Saudi Arabia and wider GCC. $63M estimated annual revenue (Startup Intros). STRUCTURAL DIFFERENTIATION: integrates
  health insurance brokerage directly with HR payroll. In UAE, group health insurance is mandatory for all employees and
  administered through brokers. Bayzat combined insurance marketplace with HR software — the insurance commission
  revenue subsidises the HR platform creating a bundled value proposition unavailable from global vendors. UAE-specific
  regulatory hyperlocalisation: WPS (Wage Protection System) compliance, DEWS (DIFC Employee Workplace Savings),
  gratuity calculations under UAE Labour Law. Investors include Point72 Mubadala (Abu Dhabi sovereign) ADQ (Abu Dhabi
  sovereign) — sovereign backing signals GCC government validation. Expanding to Saudi Arabia largest GCC market."
