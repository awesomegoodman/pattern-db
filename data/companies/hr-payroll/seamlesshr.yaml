notable_facts: "Latka estimates $27M ARR 2024. Founded by Emmanuel Okeleji (CEO) and Deji Lana (CTO) after pivoting from
  Insidify (job aggregator, unprofitable). Revenue grew 10x in first year after MVP launch. Customers: 2,000+
  medium-to-large enterprises across 20+ African countries, 300,000+ employees managed. Offices in Nigeria, Ghana,
  Kenya. IMPORTANT ICP DISTINCTION: explicitly targets medium-to-large enterprises (100+ employees), NOT SMBs. In
  African markets, SMBs lack purchasing power for HR software — the addressable market is large enterprises, not the
  long tail served by Gusto in the US. FT Africa Fastest-Growing Companies 2024. Business model: PEPM SaaS (consistent
  with IP-002 structural pattern even though ICP differs from US SMB SaaS). Expanding into embedded finance (earned wage
  access, payroll financing). Named Africa leading HR and payroll software company by multiple sources."
