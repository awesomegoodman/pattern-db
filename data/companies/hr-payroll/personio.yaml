notable_facts: "Founded 2015 Hanno Renner Roman Schumacher Arseniy Vershinin Ignaz Forstmeier Munich. All met at Center
  for Digital Technology and Management (CDTM) Munich. $435M ARR 2024 (Latka). 15000+ customers 70 countries. 2000
  employees 8 offices. Target: European SMEs 10-2000 employees. Germany primary market but UK Ireland expanding. First
  European HR tech unicorn (2021 $1.7B). Third most valuable German startup. 2022: launched Personio Payroll (German
  payroll second most complex in world after France). 2024: opened New York office. Positioned as Workday for European
  SMEs. 70% of European SMEs still use Excel for HR at time of founding — same status quo Gusto attacked in US."
