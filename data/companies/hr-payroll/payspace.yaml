notable_facts: "STRONG VALIDATOR. Founded 2002 South Africa by Bruce Clark Clyde Clark Warren Clark George
  Karageorgiades. Cloud-native payroll from inception — one of Africa earliest cloud payroll companies. 20+ years
  operating. Bootstrapped entire period with no VC. 30% annual revenue growth sustained. 14,000+ customers in 44
  countries including Heineken Coca-Cola Beverages Puma Sports. Acquired by Deel March 2024 for ~$100M — largest African
  HR tech exit to date at time. Deel acquisition rationale: PaySpace provided native payroll engines for 10+ African
  countries that Deel needed for its global payroll expansion strategy. Post-acquisition: rebranded Deel Local Payroll
  powered by PaySpace. PaySpace calculation engine became Deels calculation engine. ANALYTICALLY SIGNIFICANT: (1)
  confirms cloud payroll SaaS pattern is viable and profitable in African markets without VC; (2) bootstrapped to $100M
  exit proves the pattern does not require external capital to succeed; (3) earliest African cloud payroll company by
  founding year in this dataset — 20 years before Bento which failed. Profitability signal: Known profitable — 20+ years
  bootstrapped operation with 30% annual growth and premium acquisition price confirms sustainable unit economics."
