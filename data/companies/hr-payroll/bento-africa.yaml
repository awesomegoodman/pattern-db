notable_facts: "DISCONFIRMING CASE. Founded 2019 as Verifi by Ebun Okubanjo and Chidozie Okonkwo; rebranded to Bento
  Africa 2020. Cloud payroll and HR platform for African businesses. At peak: 900+ active Nigerian businesses, customers
  including Paystack, Moniepoint, Kobo360, Hygeia, Tangerine Africa, Helium Health. FAILURE MECHANISM: Failed to remit
  tax (PAYE) and pension payments on behalf of clients to LIRS (Lagos Inland Revenue Service) — investigated by LIRS and
  EFCC (financial crimes). CEO resigned January 2025. High-profile clients Paystack, Moniepoint, Bamboo, Kobo360 exited
  in 2024 as problems emerged. Operations temporarily halted February 2025. ANALYTICALLY NOTABLE: Failed at the core
  function it was selling — payroll compliance. This mirrors Zenefits failure mode (compliance non-compliance) but at
  the execution layer rather than the regulatory-strategy layer. Pattern failure mode: payroll compliance infrastructure
  requires operational discipline that cannot be shortcut regardless of software quality. Grounds both
  GEOGRAPHIC_WHITESPACE (Nigeria) and FAILURE_CASE_NEEDED for IP-002."
