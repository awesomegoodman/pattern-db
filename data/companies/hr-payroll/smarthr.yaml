notable_facts: "Founded 2013 Tokyo by Kensuke Naito and Shoji Miyata. Product launched 2015. $100M ARR February 2024 (up
  from $80M FY2023). Unicorn at $1.6B valuation 2021. 60,000 companies on platform. Investors: KKR Ontario Teachers
  General Atlantic. Founding insight: Miyata recovered from rare disease using national health insurance but found the
  administrative paperwork a nightmare — built to automate labour compliance paperwork that is uniquely complex in Japan
  (employment contracts social insurance year-end tax adjustments). Japan-specific regulatory complexity is the moat:
  global vendors have historically failed to localise adequately. SmartHR self-compares to Rippling as closest global
  analogue in products and strategy."
