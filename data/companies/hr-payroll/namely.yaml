notable_facts: "DISCONFIRMING. Founded 2012 New York by Matt Straz. Cloud HCM platform for mid-market companies 25-1000
  employees. Raised $200M+ positioning as modern alternative to Workday for companies too large for Gusto too small for
  full Workday implementation. Failure modes: (1) product breadth trap — tried to build payroll benefits performance
  management simultaneously competing with specialists in each; (2) sales motion mismatch — mid-market requires
  enterprise sales cycles but SMB unit economics; (3) CEO controversy and toxic workplace reports 2019 leading to
  leadership changes; (4) multiple layoff rounds 2019-2021 as growth stalled. Acquired by Vensure Employer Solutions
  (PEO/HRO company) 2022 — distressed exit. Analytically: illustrates the mid-market trap in HCM — too complex for
  self-serve economics, too small for enterprise sales ROI. The no-mans-land between Gusto and Workday."
