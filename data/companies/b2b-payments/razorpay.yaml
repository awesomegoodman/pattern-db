funding_history: "YC W15 (2015). Series A through Series F. Series F $375M August
  2021 at $7.5B valuation (Lone Pine Capital, Alkeon Capital, TCV lead). Total
  raised: $741.5M. By 2024, internal valuation significantly compressed from 2021
  peak — consistent with broad fintech multiple contraction."
