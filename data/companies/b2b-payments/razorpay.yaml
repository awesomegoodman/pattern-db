notable_facts: "Founded by Harshil Mathur and Shashank Kumar, both IIT Roorkee
  graduates who met at college. YC W15. Razorpay is the dominant developer-first
  payment API in India: 8M+ businesses, $90B+ in annual payment volume processed.
  India-specific structural advantage: Unified Payments Interface (UPI) — India's
  real-time interbank payment system — made the Indian payment landscape radically
  different from the US/Europe (card-dominated) model. Razorpay built native UPI
  integration from the start, which Stripe did not offer in India. Company claimed
  profitability in FY2023 (Indian financial year ending March 2023) but this is
  unconfirmed from external sources — private company, GAAP profitability not
  independently verified. Products expanded beyond payment acceptance into: Razorpay
  Capital (MSME lending), Razorpay Payroll (competitor to Gusto in India), and
  neobanking. The payroll expansion mirrors the trajectory of US payroll companies
  (payment acceptance -> financial services -> payroll) — a direct cross-domain
  confirmation of the payroll-from-payments expansion path observed in the HR tech
  domain. Geographic whitespace signal: the developer-first payment API pattern has
  been independently reinvented in India (Razorpay, 2014), Nigeria (Paystack, 2016),
  Netherlands (Mollie, 2004), and UK (Checkout.com, 2012) — confirming the pattern
  is not US-specific."
