    implementation_pattern: cross-border-a2a-infrastructure
    problem: cross-border-payment-infrastructure
    description: "Founded in London by Michael Kent and Boris Druppel. Initial product:
      low-cost international money transfers from Europe to 200+ countries. Direct
      competitor to Wise (then TransferWise), launched in same year. Both targeted
      the same problem: bank international transfer fees averaging 4-6% of transaction."
    source: Azimo company history / TechCrunch
  - year: 2017
    event_type: product_launch
    description: "Expanded to 200+ destination countries. Business transfer product
      launched alongside consumer. $100M+ in monthly transfer volume claimed. Series B
      and C raised. Despite scale, unit economics remained challenging — regulatory
      compliance costs and corridor banking relationships consumed margin."
    source: Azimo press releases 2017
  - year: 2022
    event_type: acquisition
    description: "Acquired by Papaya Global in February 2022 at undisclosed price.
      Sources: well below the $100M+ invested capital. Papaya Global (global payroll
      EOR company) acquired Azimo for its payment infrastructure and licences rather
      than its consumer brand — shuttered the consumer-facing Azimo brand and integrated
      payment rails into Papaya's payroll disbursement infrastructure. 10 years of
      operation ended without achieving sustainable profitability."
    source: TechCrunch / Sifted / Papaya Global press release
