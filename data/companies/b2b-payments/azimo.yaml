signal_confidence: high
notable_facts: "DISCONFIRMING CASE. Failure attribution confidence: Medium. Founded
  by Michael Kent and Boris Druppel in London. 10 years of operation, $100M+ raised,
  never achieved sustainable unit economics. Acquired by Papaya Global in February
  2022 at a price that multiple sources (TechCrunch, Sifted) described as a distressed
  acquisition well below invested capital. Structural failure analysis: Azimo reached
  approximately 1M customers and 200+ corridors by acquisition — suggesting the product
  worked technically and had demand, but the economics did not close at its achieved
  scale. Cross-border A2A requires reaching critical volume per corridor to cover
  the fixed costs of: (1) per-country regulatory licensing, (2) per-corridor local
  banking relationships, (3) FX liquidity management, (4) compliance team. Azimo
  never reached sufficient scale in enough corridors to amortise these costs. Failure
  attribution confidence: Medium — the failure is partially pattern-structural (volume
  threshold requirement) and partially execution (Azimo failed to achieve the scale
  that Wise, Remitly, and WorldRemit did with similar products and similar capital).
  Azimo's failure does not disprove the cross-border A2A pattern — Wise succeeded
  with similar approach. It establishes a lower bound: the pattern requires reaching
  scale that $100M of capital alone cannot guarantee."
