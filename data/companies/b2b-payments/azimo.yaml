funding_history: "Founded 2012. Series A through Series C. Investors: Frog Capital,
  Quona Capital, e.ventures, Greycroft, Rakuten. Total raised: $100M+. Acquired by
  Papaya Global in February 2022 at an undisclosed price — multiple sources describe
  the acquisition price as well below the capital invested, indicating a distressed
  exit."
