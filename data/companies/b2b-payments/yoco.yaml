notable_facts: "Founded in Cape Town by Katlego Maphai (CEO), Bradley Wattrus,
  Lungisa Matshoba, and Carl Wazen — the team includes black South African co-founders,
  which is significant in the context of South African financial inclusion. Core
  product: card payment terminals and POS software for South African SMBs. 200,000+
  merchants. Products: Yoco Go (portable card reader), Yoco Neo (smart POS), Yoco
  Business Account, Yoco Capital (SMB lending). Structural parallel to Moniepoint
  (Nigeria): both are full-stack payment processors targeting SMBs in an African
  market with low card terminal penetration. Both founded 2015 by entrepreneurs
  with institutional payment industry backgrounds. Both raised ~$100M range. Both
  added business banking alongside payment processing. The parallel demonstrates
  the same structural opportunity (SMB payment terminal infrastructure) is being
  independently addressed in South Africa and Nigeria — consistent with the geographic
  whitespace query pattern. South Africa structural context: card acceptance among
  SMBs significantly lower than formal retail; majority of small businesses using
  cash or EFT (electronic funds transfer) without card terminals. Yoco addresses
  this gap with affordable hardware and no monthly fees (revenue from transaction
  percentage). Southern Africa geographic whitespace now filled."
