timeline:
  - year: 2015
    event_type: founding
    implementation_pattern: full-stack-payment-processor
    problem: programmatic-payment-acceptance
    description: "Founded in Cape Town. Initial product: affordable card reader for
      South African SMBs — targeting the large population of small businesses that
      could not afford or access traditional merchant acquiring (which required monthly
      fees, credit checks, and complex applications). Same structural problem that
      Square solved in the USA in 2009, applied to South Africa in 2015."
    source: Yoco company history / Quona Capital
  - year: 2021
    event_type: funding
    implementation_pattern: full-stack-payment-processor
    description: "Series C $83M at ~$400M valuation (Dragoneer lead, Breyer Capital,
      Tiger Global). At this point: 150,000+ merchants, Yoco Business Account launched
      (neobank for SMBs), Yoco Capital launched (SMB lending using payment data for
      underwriting). Standard expansion trajectory: payment acceptance to financial
      services, identical to Moniepoint in Nigeria and Square in USA."
    capability_deployed: "Merchant payment data (transaction history, volume, seasonality)
      used as underwriting signal for Yoco Capital — same capability reuse pattern
      seen in Square Capital and Moniepoint Capital."
    source: Dragoneer / Breyer Capital Series C announcement
  - year: 2023
    event_type: product_launch
    implementation_pattern: full-stack-payment-processor
    description: "Expanded to 200,000+ merchants. Launched Yoco Neo (smart POS with
      full Android capability, replacing the basic card reader). South African market
      context: Yoco competes with traditional acquiring banks (ABSA, Standard Bank,
      FNB) that charge higher fees and have longer onboarding, and with iKhokha (local
      competitor) with similar positioning. Yoco's differentiation: no monthly fees,
      instant activation, mobile-first."
    source: Yoco press materials 2023
