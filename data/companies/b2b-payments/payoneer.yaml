funding_history: "Founded 2005. Multiple private rounds through 2020 (total ~$300M pre-SPAC).
  SPAC merger with Foley Trasimene Acquisition Corp II, listed Nasdaq (PAYO) June
  2021 at $3.3B valuation. No single large VC dependency — grew steadily from
  payment processing revenue."
revenue_signal: ">100M"
profitability_signal: known_profitable
evidence_weight: strong_validator
signal_confidence: high
notable_facts: "FY2024 revenue $953M (Nasdaq: PAYO annual report). FY2023 net income
  $18.5M — first GAAP profitable year in company history, 18 years after founding.
  Founded in New York by Israeli entrepreneurs Yuval Tal, Arnon Tzur, and Tamir
  Eisenberg. Core product: cross-border B2B payments for digital economy participants —
  freelancers, marketplace sellers (Amazon, eBay, Airbnb), and small businesses
  receiving and sending payments internationally. Amazon adopted Payoneer as the
  primary payout mechanism for its marketplace sellers globally — this was the
  distribution breakthrough. 5M+ customers in 200+ countries. Key structural
  distinction from Wise: Payoneer primarily serves the receive-side of international
  payments (freelancers and marketplace sellers receiving USD, EUR, GBP from platform
  clients) rather than the send-side (businesses sending payments to suppliers).
  Third strong validator for cross-border-a2a-infrastructure alongside Wise (UK)
  and OFX (Australia) — now with USA geography confirmed."
