notable_facts: "Founded in London and Lagos by Ola Oyetayo and Anthony Oduu — both
  Nigerian, with backgrounds in financial services. Core product: B2B FX and
  cross-border payment platform for African businesses trading internationally.
  Primary customers: African importers, exporters, and businesses that regularly
  need to convert between NGN, GHS, KES, ZAR and USD, EUR, GBP for trade purposes.
  Structural distinction from every other company in this batch: Verto is purely
  B2B, not consumer. The problem Verto solves: a Nigerian importer buying goods from
  China needs to convert NGN to USD reliably at a competitive rate — neither Nigerian
  banks (slow, high spread, capital controls) nor consumer apps (wrong customer,
  wrong volume) serve this well. Verto provides FX execution, multi-currency accounts,
  and international transfers specifically for businesses with regular FX needs in
  the $10k-$5M transaction range. The B2B FX market in Africa is significantly
  underserved: most African businesses rely on correspondent banking or the parallel
  FX market. Verto provides a regulated, transparent alternative."
