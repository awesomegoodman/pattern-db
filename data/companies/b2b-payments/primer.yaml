timeline:
  - year: 2020
    event_type: founding
    implementation_pattern: payment-orchestration-layer
    problem: programmatic-payment-acceptance
    description: "Founded by Gabriel Le Roux and Paul Anthony in London. Both ex-PayPal
      with deep payment merchant experience. Core insight: merchants using multiple
      PSPs (for redundancy, regional coverage, or better rates) have no unified way
      to manage routing logic. Each PSP has its own dashboard; routing decisions
      require engineering work. Primer creates a single canvas where payment logic
      is visual and configurable."
    source: Primer launch / Balderton Capital
  - year: 2022
    event_type: funding
    implementation_pattern: payment-orchestration-layer
    description: "Series B $50M from Accel and ICONIQ Growth. At this point: 100+
      connected payment services, visual workflow builder established, enterprise
      customers signed including Farfetch and Grab. Accel's participation — same
      firm backing Checkout.com and Adyen — signals institutional conviction in the
      orchestration layer as a distinct category from execution PSPs."
    source: Accel / ICONIQ Growth Series B announcement
