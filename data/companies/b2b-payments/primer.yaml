notable_facts: "Founded by Gabriel Le Roux and Paul Anthony — both ex-PayPal
  (Le Roux ran PayPal's merchant partnerships in Europe; Anthony was a PayPal
  engineer). Core product: visual payment workflow automation ('the payment canvas')
  — merchants connect multiple PSPs, fraud tools, and payment services through a
  drag-and-drop interface, creating payment flows without code. Primary distinction
  from Spreedly and Modern Treasury: Primer emphasises visual no-code workflow
  building over developer API access. A merchant can create a rule like 'if card
  payment fails on Stripe, retry on Adyen; if both fail, offer PayPal as fallback'
  without writing code. Customers include Farfetch, Grab, Universal Music Group,
  Skyscanner. Second UK company in payment-orchestration-layer (Spreedly is USA,
  Primer adds UK and European angle). Founded 2020 — the same year Synapse's BaaS
  middleware problems were beginning to compound — timing suggests the market was
  moving toward software-above-rails (orchestration) rather than software-as-rails
  (middleware) models."
