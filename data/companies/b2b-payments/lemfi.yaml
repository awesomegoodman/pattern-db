      Expanded to USA and Canada operations alongside UK. At this point: serving
      Nigerian, Kenyan, Ghanaian, Senegalese diaspora across three destination markets.
      Launched multi-currency accounts enabling users to hold GBP, USD, EUR."
    source: Harlem Capital / Partech Series A announcement
