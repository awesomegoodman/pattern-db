notable_facts: "Founded by Ridwan Olalere and Rian Cochran in London. YC W21.
  Core product: multi-currency accounts and international transfers for African
  diaspora — specifically enabling Nigerians, Kenyans, and Ghanaians in the UK,
  USA, and Canada to send money home at lower cost than traditional remittance
  channels. Three-pronged value proposition: (1) hold foreign currency (GBP, USD,
  CAD) in a UK/US/Canadian account, (2) receive salary and payments from international
  employers, (3) send to Africa via local mobile money and bank rails. Addresses
  a different problem from Wise and OFX: LemFi primarily serves first-generation
  immigrants who need to operate in two financial systems simultaneously — earning
  in UK/USA, living across two jurisdictions. Structural gap: banks in UK charge
  £20-25 per international transfer; LemFi charges flat fee of £2-3. User base
  in Nigeria, Kenya, Ghana, Senegal, Uganda, Cameroon diaspora in UK/Canada/USA."
