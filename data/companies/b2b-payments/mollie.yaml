notable_facts: "Founded by Adriaan Mol in Amsterdam. 17 years of self-funded
  operation before raising external capital — the same economic signal as Spreedly
  in the payment-orchestration-layer pattern. Dutch KvK (Chamber of Commerce)
  filings, which are mandatory for Netherlands companies, show revenue growth from
  EUR 32M (2019) to EUR 192M (2022), with consistent profitability before the 2021
  growth round. EUR 6.5B valuation likely compressed significantly by 2024 given
  broad fintech multiple contraction. 250,000+ business customers across Netherlands,
  Belgium, Germany, France, UK. Processes EUR 40B+ in annual payments. Core
  differentiation: developer-first API with European-native payment method support
  (iDEAL, Bancontact, SEPA Direct Debit, Klarna, Sofort) that Stripe did not
  support natively in Europe for many years. Customers include Trivago, Deliveroo,
  UNICEF, Hubspot. Founding team background: Adriaan Mol was a serial entrepreneur
  who had built several Dutch internet companies before Mollie. The 17-year
  bootstrapped period confirms the developer-first payment API model produces
  sustainable economics without external capital — the primary strong validator
  signal for this pattern in Europe."
