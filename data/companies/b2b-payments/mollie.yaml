funding_history: "Self-funded from founding (2004) through 2021 — 17 years of
  zero external capital. First external funding: EUR 665M from General Atlantic,
  Blackstone, EQT Growth in 2021 at EUR 6.5B valuation. The 17-year self-funded
  period is the primary economic signal. Total external raised: EUR 665M."
