    description: "Spun out of National Data Corporation (NDC) as an independent public
      company. Initial business: merchant payment processing for US and Canadian
      businesses. NDC had been processing card payments since the 1970s — Global
      Payments inherited 30 years of payment infrastructure and acquiring relationships.
      IPO on NYSE at founding."
    source: Global Payments company history / NYSE
  - year: 2015
    event_type: acquisition
    implementation_pattern: full-stack-payment-processor
    description: "Acquired Heartland Payment Systems for $4.3B — added 300,000+
      US SMB merchants and software-integrated payments. Heartland was notable for
      a 2008 data breach that exposed 130M+ card numbers — making it one of the
      largest payment processor breaches in history and a key driver of tokenisation
      and end-to-end encryption adoption across the industry."
    capability_acquired: "SMB software-integrated payment infrastructure and direct
      acquiring relationships with 300,000+ merchants via Heartland's point-of-sale
      ecosystem."
    source: Global Payments press release 2015
  - year: 2019
    event_type: acquisition
    implementation_pattern: full-stack-payment-processor
    description: "Merged with TSYS (Total System Services) in $21.5B all-stock deal.
      TSYS was one of the largest card processors in the world (card issuer processing
      for banks, plus merchant acquiring). Combined entity processed $6T+ in annual
      payment volume, covering merchant acquiring AND card issuer processing — the
      full payment stack."
    capability_acquired: "Card issuer processing for banks (TSYS's primary business)
      added to merchant acquiring — creating a combined entity that touches both
      sides of every card transaction."
    source: Global Payments / TSYS merger proxy 2019
