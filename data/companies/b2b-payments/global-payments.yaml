funding_history: "Spun out of National Data Corporation (NDC) in 2001. IPO on NYSE
  (GPN) at founding. No VC dependency — grew from payment processing revenue.
  Major acquisitions: Heartland Payment Systems $4.3B (2015), TSYS (Total System
  Services) $21.5B (2019), EVO Payments $4.0B (2023). Total M&A: $30B+ since
  founding."
revenue_signal: ">1B"
profitability_signal: known_profitable
evidence_weight: strong_validator
signal_confidence: high
notable_facts: "FY2024 adjusted net revenue $9.4B, adjusted EPS strongly profitable
  (NYSE: GPN annual report). Processes payments for 4M+ merchant locations across
  100+ countries. Originally spun out of National Data Corporation's payment
  processing division — making it a direct descendant of the legacy payment
  processing infrastructure built in the 1970s-80s. Third strong validator for
  full-stack-payment-processor (alongside Adyen, Interswitch), now with USA
  geography covered. Structural distinction from Adyen: Global Payments uses an
  acquisition-led growth model (acquiring Heartland, TSYS, EVO) to build geographic
  coverage, whereas Adyen built single-platform coverage organically. Both instantiate
  the same pattern (full-stack payment processor) with different execution approaches —
  a pattern-level confirmation that multiple implementations can succeed under the
  same structural conditions. Key insight from M&A strategy: the full-stack payment
  processor pattern in mature markets requires either organic global platform build
  (Adyen approach, 18 years) or acquisition roll-up (Global Payments approach, $30B+).
  Both are economically viable; the acquisition approach produces faster geographic
  coverage but lower margin purity."
