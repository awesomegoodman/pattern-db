notable_facts: "Founded in Jakarta by Moses Lo, Juan Gonzalez, Tessa Wijaya, and
  Bo Chen — all University of California Berkeley and Stanford alumni who met at YC.
  Core product: payment API for Southeast Asian businesses covering Indonesia,
  Philippines, Thailand, Malaysia, Vietnam. Known as 'the Stripe of Southeast Asia'
  — developer-first API, instant account activation, unified API for local payment
  methods (bank transfers, e-wallets, QRIS, virtual accounts, retail outlets) that
  card-only APIs like early Stripe did not serve. SE Asia structural context: credit
  card penetration below 5% in Indonesia; dominant payment methods are bank transfer,
  e-wallets (GoPay, OVO, ShopeePay), and QRIS (QR code standard). Xendit natively
  integrates all. 3,000+ businesses including Grab, Lazada, Traveloka. Claimed
  profitability in 2023 (unconfirmed from external sources). Geographic whitespace
  confirmation: the developer-first payment API pattern has now been independently
  reinvented in five geographies (USA/Stripe 2010, Netherlands/Mollie 2004,
  Nigeria/Paystack 2016, UK/Checkout.com 2012, SE Asia/Xendit 2015) — all founding
  on the same structural insight that incumbent payment acceptance required weeks-long
  applications and complex technical integrations that a developer-first API could
  replace."
