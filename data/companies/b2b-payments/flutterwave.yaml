  - year: 2021
    event_type: funding
    implementation_pattern: local-rail-aggregation
    description: "Series C $170M at $1B valuation — Africa's first payments unicorn
      by VC valuation. Processed $9B in payment volume in 2020. 290,000 businesses.
      Visa and Mastercard took strategic positions."
    source: TechCrunch Series C announcement
  - year: 2022
    event_type: market_entry
    implementation_pattern: local-rail-aggregation
    problem: b2b-cross-border-payments
    description: "Series D $250M at $3B valuation. Expanded to 34 African countries.
