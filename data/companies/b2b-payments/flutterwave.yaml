  - slug: cross-border-payment-infrastructure
    confidence: medium
    notes: "Flutterwave enables cross-border payments within Africa and between Africa
      and global markets — both acceptance (money in from global platforms) and
      cross-border transfer (money moving across African countries)."
timeline:
  - year: 2016
    event_type: founding
    implementation_pattern: local-rail-aggregation
    problem: programmatic-payment-acceptance
    description: "Founded by GB Agboola and Iyinoluwa Aboyeji. Initial product: payment
      infrastructure enabling African businesses to accept payments from global platforms
      (Facebook, Uber) and enabling global platforms to pay African users. Core insight:
      Uber needed to pay Nigerian drivers; Nigerian drivers needed to receive money
      from Uber. No simple API existed for either side."
    source: Flutterwave company history / YC S17 profile
  - year: 2017
    event_type: funding
    implementation_pattern: local-rail-aggregation
    description: "YC S17 batch. First institutional funding. YC accelerator provided
      access to US investor network and the credibility that enabled subsequent VC
      rounds from global funds."
    source: YC alumni directory
  - year: 2021
    event_type: funding
    implementation_pattern: local-rail-aggregation
    description: "Series C $170M at $1B valuation — Africa's first payments unicorn
      by VC valuation (Interswitch reached unicorn status via strategic Visa investment
      rather than VC round). Processed $9B in payment volume in 2020. 290,000 businesses.
      Visa and Mastercard took strategic positions."
    source: TechCrunch Series C announcement
  - year: 2022
    event_type: market_entry
    implementation_pattern: local-rail-aggregation
    problem: cross-border-payment-infrastructure
    description: "Series D $250M at $3B valuation. Expanded to 34 African countries.
      CBN licence suspended August 2022 (restored 2023 after compliance improvements).
      Regulatory episode illustrates the challenge of maintaining licences across
      multiple African jurisdictions simultaneously — the capability that the domestic-
      payment-infrastructure pattern (Interswitch) built deliberately vs Flutterwave's
      expansion-first approach."
    source: TechCrunch Series D / CBN regulatory notices
