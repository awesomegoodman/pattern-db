funding_history: "YC S17 (2017). Series A $10M 2018 (Greycroft, Green Visor Capital).
  Series B $35M 2020 (Tiger Global lead). Series C $170M July 2021 at $1B valuation
  (unicorn). Series D $250M February 2022 at $3B valuation (B Capital Group lead).
  Total raised: $474M+. Visa and Mastercard are strategic investors."
revenue_signal: ">100M"
profitability_signal: unknown
evidence_weight: weak_validator
signal_confidence: low
notable_facts: "Founded by Olugbenga (GB) Agboola and Iyinoluwa Aboyeji in San Francisco
  with Nigerian operations base. YC S17. Processes payments across 34 African countries
  + global. 900,000+ businesses, $26B in annualised payment volume (2022 claim).
  Customers include Uber, Facebook, Flutterwave Store, AirtelTigo. Products: Rave
  (payment gateway), Barter (consumer wallet), Flutterwave Store (e-commerce). Founded
  by former UBA bank executive (Agboola) and first Africa country manager of Andela
  (Aboyeji). Strategic distinction from Interswitch: Interswitch built domestic Nigerian
  rails first then expanded regionally; Flutterwave built pan-African cross-border
  connectivity first. Regulatory challenges: CBN licence suspended 2022 (restored 2023)."
