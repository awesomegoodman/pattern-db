notable_facts: "Founded by Itai Damti (CEO) and Doron Somech in San Francisco.
  Damti was previously co-founder of Lemonade (insurance) and is a vocal participant
  in post-Synapse industry discussions about BaaS architecture. Unit represents the
  direct-bank-partnership implementation of embedded banking — explicitly designed
  to avoid the middleware ledger architecture that caused Synapse's collapse. Core
  structural distinction: Unit's partner banks (Thread Bank, Blue Ridge Bank) hold
  deposits directly and maintain the authoritative ledger. Unit provides compliance
  software, product tooling, and banking programme management as a software layer
  without interposing a second ledger. When Mercury (a Unit customer) was affected
  by the Evolve Bank / Synapse fallout, Mercury's transition away from Synapse was
  cleaner precisely because their bank held the authoritative record, not a middleware
  provider. Customers include Gusto (payroll), Freshworks (SaaS), Wave (digital
  banking), and HoneyBook (creative businesses). Unit is the canonical instantiation
  of direct-bank-partnership — the corrected implementation that emerged directly
  from the BaaS middleware failure. Damti was a panelist at TechCrunch Disrupt 2024
  discussing the Synapse collapse and advocating for the direct bank partnership
  model as the structural replacement."
