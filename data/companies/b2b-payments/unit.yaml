      point: 100+ fintech companies using Unit's infrastructure. Customers include
      Gusto, Freshworks, Wave. Bank partners include Thread Bank and Blue Ridge Bank.
      The Synapse crisis (which began deteriorating in 2023) validated Unit's architectural
      choice — fintech companies that had avoided middleware ledgers had cleaner
      regulatory positions."
    source: Insight Partners Series B announcement
  - year: 2024
    event_type: product_launch
    implementation_pattern: direct-bank-partnership
    description: "Synapse bankruptcy (April 2024) caused significant market shift.
      Unit's approach — direct bank partnership without middleware ledger — became
      the dominant industry standard. Multiple banks that had ended BaaS middleware
      relationships (post-Synapse) began direct partnership relationships with
      infrastructure providers like Unit. FDIC proposed Synapse Rule (October 2024)
      codified the direct bank recordkeeping requirement Unit had always used."
    source: TechCrunch / FDIC Synapse Rule / Unit blog
