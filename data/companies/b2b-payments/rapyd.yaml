funding_history: "Founded 2016. Series A $40M 2019 (Target Global lead). Series B
  $100M 2020. Series C $300M March 2021 at $2.5B valuation. Series D $610M July 2021
  at $8.75B valuation (Coatue, Tiger Global lead). Series E $300M 2022 at $15B
  valuation (peak). Total raised: $770M+. Valuation significantly compressed by 2024
  — reports of ~$5B internal valuation, reflecting 2021 era overpricing."
revenue_signal: ">100M"
