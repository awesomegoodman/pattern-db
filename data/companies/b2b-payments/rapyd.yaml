signal_confidence: low
notable_facts: "Founded in London by Arik Shtilman (CEO), Arkady Karpman (CTO),
  and Omer Priel — all ex-PayPal employees. Core product: Fintech-as-a-Service
  (FaaS) — a single API aggregating 900+ local payment methods across 100+ countries
  for collect, disburse, issue, and wallet capabilities. B2B2B model: Rapyd sells
  to businesses that embed its payment capabilities into their own products. Primary
  distinction from Stripe/Checkout.com: Rapyd focuses on the long tail of local
  payment methods in emerging markets (mobile money, bank transfers, cash networks,
  local wallets) rather than card-first markets. Secondary distinction from dLocal:
  Rapyd targets the broadest possible geographic coverage (100+ countries) rather
  than deep local expertise in a smaller set of emerging markets. Valuation trajectory
  ($2.5B March 2021 → $15B July 2022 → ~$5B 2024) is an illustrative case of
  2021-era fintech overpricing and subsequent correction — the business is still
  operating and growing, but investor expectations were set at peak multiples. Third
  observation for local-rail-aggregation pattern (with dLocal and Flutterwave)."
