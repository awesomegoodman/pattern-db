    source: FCA register / administrator filing / TechCrunch
    notes: "DISCONFIRMING. Railsr's failure mode differs from Synapse: not ledger
      reconciliation failure, but regulatory compliance cost failure. The middleware
      layer must bear FCA e-money institution compliance costs (fixed, high) while
      earning variable per-transaction revenue insufficient to cover them at Railsr's
      scale. Pattern-attributable with High confidence."
problems:
  - slug: embedded-banking-infrastructure
timeline:
  - year: 2016
    event_type: founding
    implementation_pattern: baas-middleware
    problem: embedded-banking-infrastructure
    description: "Founded as Railsbank by Nigel Verdon and Clive Mitchell in London.
      Both had institutional banking backgrounds (Visa, RBS). Initial product: API
      layer enabling fintechs to embed banking features (card issuing, BIN sponsorship,
      compliance) without obtaining their own FCA e-money licence. Operated as a
      licensed e-money institution, providing the regulatory umbrella for fintech
      customers."
    source: Railsbank founding / FCA e-money register
  - year: 2021
    event_type: funding
    implementation_pattern: baas-middleware
    description: "Series B GBP 70M (Anthos Capital lead). Rebranded positioning toward
      embedded finance. Customers at this point included Tide (UK business banking),
      Freetrade (investment app), and other UK fintechs. Revenue insufficient to
      cover compliance costs at scale — the structural economics that would later
      cause administration were present but masked by growth capital."
    source: Anthos Capital / TechCrunch Series B
  - year: 2023
    event_type: shutdown
    implementation_pattern: baas-middleware
    description: "Entered administration October 2023. Immediate causes: (1) failed
      to raise Series D capital after multiple attempts, (2) FCA scrutiny of BaaS
      models following industry-wide concerns, (3) compliance costs exceeding revenue
      at Railsr's transaction volume. Administrator Alvarez & Marsal appointed.
      Assets acquired by Embedded Finance Limited (EFL). Customers including Tide
      had to migrate to alternative providers. Confirms: the BaaS middleware pattern
      requires a scale of transaction volume that most BaaS providers cannot reach
      while maintaining full regulatory compliance costs."
    source: TechCrunch / Alvarez & Marsal administrator filing / FCA public register
