signal_confidence: high
notable_facts: "DISCONFIRMING CASE — High failure attribution confidence. Second
  confirmed failure of the baas-middleware implementation pattern (Synapse being
  the first). Entered administration October 2023 after failing to raise Series D
  capital and losing key regulatory standing. Founded by Nigel Verdon (ex-Visa,
  ex-Royal Bank of Scotland) and Clive Mitchell. Provided BIN sponsorship, card
  issuing APIs, and banking-as-a-service to UK fintechs including Tide Business
  Banking, Freetrade (investment app), and others. Rebranded from Railsbank to
  Railsr in 2022 — a signal of the company attempting to reposition during a period
  of financial stress. Failure mode is structurally DISTINCT from Synapse: Synapse
  failed due to ledger reconciliation failure between middleware and sponsor bank.
  Railsr failed due to the cost of maintaining FCA e-money institution compliance
  and BIN sponsorship agreements exceeding the revenue generated at its scale —
  the regulatory cost structure of BaaS middleware is fixed and high; the revenue
  is variable and per-transaction. At Railsr's scale, these did not meet.
  Failure attribution confidence: High — failure is directly attributable to the
  BaaS middleware pattern's structural economics: middleware companies bear the full
  cost of regulatory compliance (FCA licensing, compliance team, audit costs) but
  capture only a thin spread per transaction from fintechs who themselves take
  margin from end customers. Two independent disconfirming cases (Synapse USA 2024,
  Railsr UK 2023) with different failure modes confirm the BaaS middleware pattern
  is structurally challenged rather than a single company execution failure."
implementation_patterns:
