funding_history: "VC-backed pre-IPO (Battery Ventures, Emergence Capital, DCM Ventures,
  others). IPO December 2019 on NYSE (BILL) at ~$1.6B market cap. Acquired Divvy
  (spend management) for $2.5B in 2021. Acquired Invoice2go for $625M in 2021."
revenue_signal: ">1B"
profitability_signal: unknown
evidence_weight: weak_validator
signal_confidence: high
notable_facts: "FY2024 (ending June 2024): total revenue $1,327M (+19% YoY). GAAP
  net loss $339M — primarily driven by $243M in goodwill impairment and D&A from
  Divvy and Invoice2go acquisitions. Non-GAAP operating income positive. 470,000+
  SMB customers. $287B in payment volume facilitated FY2024. Founded by Rene Lacerte,
  whose family had run a payroll company (he was motivated by watching his parents
  struggle with AP). Serves the SMB AP automation market (companies with 10-200
  employees). Evidence weight: weak_validator — public company but GAAP loss-making
  primarily due to acquisition-related charges; underlying payment operations business
  appears cash-flow positive but core profitability unconfirmed without disclosure
  of segment economics. Canonical instantiation of accounts-payable-automation
  implementation pattern."
