timeline:
  - year: 2006
    event_type: founding
    implementation_pattern: accounts-payable-automation
    problem: programmatic-payment-disbursement
    description: "Founded by Rene Lacerte in San Jose, CA. Initial product: cloud-based
      accounts payable and receivable automation for SMBs. Lacerte's motivation: watched
      his parents struggle with manual invoice processing at their payroll business.
      First target market: accounting firms that could resell BILL to their SMB clients."
    source: BILL company history / founder interviews
  - year: 2019
    event_type: funding
    implementation_pattern: accounts-payable-automation
    description: "IPO on NYSE (BILL) at $22/share, market cap ~$1.6B. At IPO:
      81,000 customers, $47B in payment volume in trailing 12 months. Accounting firm
      channel (Intuit QuickBooks partnership) was primary distribution."
    source: BILL S-1 / NYSE listing
  - year: 2021
    event_type: acquisition
    implementation_pattern: accounts-payable-automation
    description: "Acquired Divvy (corporate spend management + cards) for $2.5B and
      Invoice2go (invoicing for freelancers) for $625M. Attempted to expand from pure
      AP automation into full spend management. Both acquisitions resulted in significant
      goodwill impairment by 2023-2024 as the combined business underperformed
      acquisition-price expectations."
    capability_acquired: "Corporate card issuing capability and spend management
      workflow via Divvy."
    source: BILL press releases / FY2024 annual report (goodwill impairment)
  - year: 2024
    event_type: product_launch
    implementation_pattern: accounts-payable-automation
    description: "FY2024: $1.327B revenue, 470,000+ customers, $287B payment volume.
      Refocused on core AP/AR product after Divvy integration challenges. Market cap
      compressed from $30B peak (2021) to ~$3B (2024) — reflects acquisition overpayment
      rather than core business failure."
    source: BILL FY2024 annual report / earnings call
