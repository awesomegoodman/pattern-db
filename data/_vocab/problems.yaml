- slug: wage-compliance
  statement: Businesses cannot calculate, withhold, and disburse employee wages while remaining compliant with tax and
    labour regulations.
  lifecycle: mature
  notes: "Status quo: manual calculation + paper cheques + accountant. Underlying constraint: regulatory friction +
    coordination failure. Frequency: bi-weekly. Urgency: high (legal obligation with penalties for non-compliance).
    Existing spend: significant — accountant fees, internal labour, penalty risk."
- slug: employee-benefits
  statement: Businesses cannot provide employees with competitive benefits packages without the purchasing power of large
    employers.
  lifecycle: mature
  notes: "Status quo: direct insurer negotiation (only viable at scale) or no benefits offered. Underlying constraint:
    scale requirements. SMBs cannot access group rates without aggregation. Urgency: high — benefits are a key hiring
    and retention lever."
- slug: it-provisioning
  statement: Businesses cannot provision or deprovision employee access to software, hardware, and corporate systems as a
    single coordinated action.
  lifecycle: growing
  notes: "Status quo: manual IT tickets + email + spreadsheets per system. Underlying constraint: coordination failure —
    each system has separate admin. Urgency: grows with employee count and number of SaaS tools. Security risk on
    offboarding is significant driver."
- slug: cross-border-employment
  statement: Companies cannot legally employ workers in foreign jurisdictions without establishing local legal entities,
    which takes 12-18 months and significant capital.
  lifecycle: growing
  notes: "Status quo: contractor misclassification (legally risky) or entity setup (slow, expensive, $20k-$100k+).
    Underlying constraint: regulatory friction per jurisdiction. Accelerated by remote work normalisation post-2020.
    Triggers: hiring a specific person abroad, entering a new market, distributed team formation."
- slug: programmatic-payment-acceptance
  statement: "Businesses cannot accept money from customers programmatically without
    building or licensing regulated payment processing infrastructure from scratch."
  lifecycle: mature
  notes: "Status quo: cash, cheque, or manual bank transfer. Underlying constraint:
    regulatory friction (banking licences, PCI-DSS, card scheme membership, AML/KYC)
    + scale requirements (card network access requires minimum volume commitments).
    Frequency: per transaction. Urgency: high — inability to accept payment is inability
    to do business online. This problem grounds the payroll-processing-infrastructure
    winning condition cross-industry: the same mechanism (regulatory complexity makes
    in-house execution uneconomic) operates identically in payments."

- slug: programmatic-payment-disbursement
  statement: "Businesses cannot disburse money to suppliers, contractors, or third
    parties programmatically at scale without manual data entry, approval workflows,
    and bespoke banking system integrations."
  lifecycle: mature
  notes: "Status quo: paper cheques, manual wire transfers, finance teams processing
    invoices individually. Underlying constraint: coordination failure — each supplier
    relationship has separate payment terms, bank details, and approval chains. Distinct
    from payment acceptance (money in vs money out) and requires different infrastructure
    (AP workflow + outbound rail vs acquiring + inbound settlement)."

- slug: b2b-cross-border-payments
  statement: "Businesses cannot disburse or receive payments across international borders
    programmatically without establishing banking relationships in each jurisdiction,
    accepting correspondent banking fees, or waiting days for settlement."
  lifecycle: growing
  notes: "Distinct from c2c-international-remittance by regulatory license type (payment
    institution / EMI licence vs money-transmitter licence), unit economics (lower volume,
    higher ticket, negotiated FX spreads, relationship sales), and product requirements
    (API integration, multi-currency accounts, treasury tooling). Status quo: correspondent
    banking via SWIFT (2-5 days, 3-5% cost). Underlying constraint: coordination failure
    between national banking systems compounded by per-jurisdiction regulatory friction.
    Primary companies: Airwallex, Wise for Business, OFX, Nium, Verto, Payoneer, Corpay.
    Split from cross-border-payment-infrastructure 2025 — prior problem slug conflated
    B2B and C2C segments whose winning conditions, unit economics, and regulatory
    structures differ materially."

- slug: c2c-international-remittance
  statement: "Individuals cannot send money to family or dependents abroad without paying
    high fees, accepting slow settlement, or relying on informal channels."
  lifecycle: growing
  notes: "Distinct from b2b-cross-border-payments by regulatory license type (money-transmitter
    licence), unit economics (high volume, low ticket, FX spread with margin compression,
    high CAC via diaspora community trust), and distribution (agent networks, mobile-money
    integrations, community word-of-mouth). Status quo: informal channels (hawala, cash
    couriers), Western Union, MoneyGram (expensive, slow). Underlying constraint: diaspora
    communities lack access to cheap cross-border rails that banks reserve for commercial
    customers. Primary companies: LemFi, Mukuru, Grey, NALA, Chipper Cash, Azimo,
    Remitly, Zepz. Note Mukuru's ToS explicitly prohibits business use on its core
    remittance product — clearest evidence of structural C2C-only design."

- slug: embedded-banking-infrastructure
  statement: "Non-bank businesses cannot offer financial services to their customers
    without obtaining banking licences or partnering with licensed intermediaries who
    can manage the regulatory complexity on their behalf."
  lifecycle: growing
  notes: "Status quo: businesses either obtain banking licences (expensive, 2-5 years,
    geography-specific) or do not offer financial services. Underlying constraint:
    regulatory friction — banking licences required per jurisdiction and per product type.
    BaaS middleware (Synapse model) was the dominant implementation 2018-2023; its
    structural failure in 2024 has shifted demand toward direct bank partnership models
    that eliminate the middleware ledger reconciliation risk."

