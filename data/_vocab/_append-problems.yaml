- slug: embedded-banking-infrastructure
  statement: "Non-bank businesses cannot offer financial services to their customers
    without obtaining banking licences or partnering with licensed intermediaries who
    can manage the regulatory complexity on their behalf."
  lifecycle: growing
  notes: "Status quo: businesses either obtain banking licences (expensive, 2-5 years,
    geography-specific) or do not offer financial services. Underlying constraint:
    regulatory friction — banking licences required per jurisdiction and per product type.
    BaaS middleware (Synapse model) was the dominant implementation 2018-2023; its
    structural failure in 2024 has shifted demand toward direct bank partnership models
    that eliminate the middleware ledger reconciliation risk."
