- slug: payroll-processing-infrastructure
  name: Payroll processing infrastructure
  sector: hr-and-workforce
  first_observed: 1949
  pattern_durability: decades-old
  winning_condition: Regulatory complexity creates recurring non-discretionary demand for compliance execution, and the
    rate of regulatory change keeps that complexity high enough that specialist knowledge cannot be cost-effectively
    replicated in-house.
  failure_condition: Regulatory complexity stabilises or decreases to the point where in-house compliance execution
    becomes cheaper than specialist outsourcing, or a general-purpose software platform successfully abstracts the
    compliance layer at a price below specialist outsourcing cost.
  winning_condition_maturity: established
  winning_condition_valid_from: 1949
  notes: "The structural bet that a third party can handle wage calculation, tax withholding, and disbursement more
    reliably and cheaply than employers doing it themselves. Has produced profitable operators across three distinct
    technological eras: manual bureau, desktop/server, cloud SaaS. Winning/Failure conditions deferred — need 3+
    cross-industry observations."

- slug: cloud-hcm-platform
  name: Cloud HCM platform
  sector: hr-and-workforce
  first_observed: 2005
  pattern_durability: established
  winning_condition: Incumbent's installed-base lock-in prevents it from offering cloud delivery without cannibalising
    existing licence revenue, creating a durable opening for a cloud-native entrant whose cost structure carries no
    on-premise installed base to protect.
  failure_condition: Incumbent successfully completes cloud transition — via acquisition, rebuild, or partner ecosystem —
    before the cloud-native entrant reaches sufficient scale, closing the cost structure window before the entrant
    achieves switching-cost parity.
  winning_condition_maturity: proposed
  winning_condition_valid_from: 2005
  notes: The structural bet that a unified cloud platform can replace fragmented on-premise HR software (PeopleSoft, SAP)
    for enterprise workforce management. Founded on the insight that cloud delivery enables continuous updates,
    cross-module data sharing, and lower total cost of ownership than on-premise.

- slug: global-employment-infrastructure
  name: Global employment infrastructure
  sector: hr-and-workforce
  first_observed: 2016
  pattern_durability: emerging
  winning_condition: "The per-country cost and timeline of establishing local
    legal entities creates a threshold below which a company holding pre-existing
    entity infrastructure across those jurisdictions can price the capability
    more cheaply than self-build — making EOR economically rational for any
    employer below that headcount-per-country threshold."
  failure_condition: "A hiring company's geographic footprint and per-country
    headcount grows large enough that annualised EOR fees exceed the amortised
    cost of its own local entity, making self-build economically rational and
    eliminating the EOR cost advantage at that scale."
  winning_condition_maturity: proposed
  winning_condition_valid_from: 2016
  notes: "The structural bet that a technology-enabled intermediary can absorb the legal and compliance complexity of
    cross-border employment, making global hiring accessible without entity setup. Two sub-approaches: entity-ownership
    model (Deel, Remote) vs. partner model (Papaya Global). Entity-ownership model appears to be winning as of 2025."

- slug: compound-workforce-management-platform
  name: Compound workforce management platform
  sector: hr-and-workforce
  first_observed: 2016
  pattern_durability: emerging
  notes: The structural bet that HR, IT, and Finance are not separate domains but a single operational problem — managing
    the employee lifecycle — that should be served by one data model. Requires a unified employee record as the core
    primitive. Parker Conrad's explicit thesis at Rippling after diagnosing Zenefits's failure.

- slug: payment-processing-infrastructure
  name: Payment processing infrastructure
  sector: financial-services
  first_observed: 1960
  pattern_durability: decades-old
  winning_condition: "Regulatory complexity creates recurring non-discretionary demand
    for compliance execution, and the rate of regulatory change keeps that complexity
    high enough that specialist knowledge cannot be cost-effectively replicated in-house."
  failure_condition: "Regulatory complexity stabilises or decreases to the point where
    in-house compliance execution becomes cheaper than specialist outsourcing, or a
    general-purpose software platform successfully abstracts the compliance layer at
    a price below specialist outsourcing cost."
  winning_condition_maturity: proposed
  winning_condition_valid_from: 1960
  notes: "The structural bet that a specialist third party can handle payment acceptance
    and processing more reliably and cheaply than businesses building the infrastructure
    themselves. Direct cross-industry confirmation of the payroll-processing-infrastructure
    winning condition: regulatory complexity (PCI-DSS, banking licences, card scheme
    membership, AML/KYC) makes in-house execution uneconomic for all but the largest
    enterprises — the same structural mechanism operating in a different industry."

- slug: cross-border-payment-network
  name: Cross-border payment network
  sector: financial-services
  first_observed: 1973
  pattern_durability: decades-old
  winning_condition: "Correspondent banking's multi-hop settlement structure
    creates a cost floor and settlement delay exploitable while a bilateral
    network can establish local currency liquidity in origin and destination
    markets, eliminating correspondent margins on each intermediate hop."
  failure_condition: "Real-time gross settlement interoperability between
    national banking systems — via central bank collaboration, ISO 20022
    adoption, or CBDC infrastructure — eliminates the correspondent banking
    overhead that made the bilateral network cost advantage possible."
  winning_condition_maturity: proposed
  winning_condition_valid_from: 2011
  notes: "The structural bet that a network connecting disparate national banking systems
    can move money internationally faster and cheaper than correspondent banking (SWIFT,
    first instantiated 1973). Serves two structurally distinct demand populations under
    one solution pattern: (1) B2B cross-border payables — Airwallex, Wise for Business,
    OFX, Nium; (2) C2C diaspora remittance — LemFi, Mukuru, Grey, NALA, Remitly, Zepz.
    Winning conditions, unit economics, and regulatory structures differ materially
    between segments — Q01 and Q02 must be filtered by customer_segment to return
    valid conclusions."

- slug: embedded-banking-infrastructure
  name: Embedded banking infrastructure
  sector: financial-services
  first_observed: 2018
  pattern_durability: emerging
  notes: "The structural bet that a regulated intermediary layer can enable non-bank
    businesses to offer financial services without obtaining banking licences themselves.
    Two implementation sub-models: (1) BaaS middleware (Synapse — dead 2024) which
    sat between sponsor banks and fintechs, creating ledger reconciliation risk;
    (2) direct bank partnership which eliminates the middleware layer. Synapse's 2024
    bankruptcy is the canonical disconfirming case establishing that the three-party
    middleware structure carries unacceptable ledger reconciliation risk at scale."
