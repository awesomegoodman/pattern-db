- slug: manual-payroll-bureau
  name: Manual payroll bureau
  solution_pattern: payroll-processing-infrastructure
  first_observed: 1949
  status: live
  business_model: Per-employee-per-period fee (outsourced service)
  pricing_signal: <100/mo
  notes: "Offline service model: employer sends payroll data, bureau processes and disburses. Initial advantage: batch
    processing at scale that individual employers could not achieve. Moat: switching cost from embedded payroll data +
    compliance records. Mechanism: delegation. Status quo displaced: in-house manual payroll by an accountant or
    bookkeeper."
- slug: on-premise-enterprise-hcm-platform
  name: On-premise enterprise HCM platform
  solution_pattern: cloud-hcm-platform
  first_observed: 1987
  status: dead
  business_model: Perpetual software licence + annual maintenance fees (17-22% of licence)
  pricing_signal: enterprise
  notes: "The dominant enterprise HR delivery model from the late 1980s through mid-2000s. Client-server architecture
    installed on customer infrastructure. High implementation cost ($1M-$10M+), long deployment cycles (12-24 months),
    and expensive upgrade projects every 3-5 years. Pattern lost to cloud HCM because incumbent vendors (PeopleSoft,
    SAP) could not transition to SaaS without cannibalising their own maintenance revenue streams. This is the
    structural opening that Workday exploited at founding in 2005. Mechanism: abstraction (same as cloud HCM). Status
    quo displaced: manual HR processes, paper-based records, basic accounting software. Status: dead as an independent
    pattern — remaining on-premise deployments are maintained by Oracle (via PeopleSoft) and SAP but no new net-new
    on-premise deployments are occurring at scale."
- slug: cloud-native-smb-payroll-saas
  name: Cloud-native SMB payroll SaaS
  solution_pattern: payroll-processing-infrastructure
  first_observed: 1998
  status: live
  business_model: Per-employee-per-month subscription
  pricing_signal: <100/mo
  notes: "Self-serve web-based payroll for businesses with 1-500 employees. Initial advantage: internet-native interface
    vs. desktop software and fax-based bureau model. Moat: payroll data stickiness + accountant referral network.
    Mechanism: abstraction. Status quo displaced: ADP/Paychex bureau model + QuickBooks desktop. Business model
    convergence confirmed: every surviving operator uses PEPM subscription — Paycom (1998), Paylocity (1997), Gusto
    (2012), BambooHR (2008), Justworks (2012)."
- slug: cloud-enterprise-hcm-platform
  name: Cloud enterprise HCM platform
  solution_pattern: cloud-hcm-platform
  first_observed: 2005
  status: live
  business_model: Enterprise subscription (annual contract)
  pricing_signal: enterprise
  notes: "Cloud-first replacement for on-premise HCM (PeopleSoft, SAP SuccessFactors) targeting Fortune 500 and large
    enterprises. Initial advantage: single-version cloud model (no costly upgrades) vs. on-premise maintenance burden.
    Moat: deep system-of-record integration, switching cost from years of workforce data. Mechanism: abstraction. Status
    quo displaced: Oracle PeopleSoft, SAP on-premise."
- slug: compliance-led-free-hr-saas
  name: Compliance-led free HR SaaS (broker revenue model)
  solution_pattern: payroll-processing-infrastructure
  first_observed: 2013
  status: dead
  business_model: Insurance broker commissions (software free to employer)
  pricing_signal: free
  notes: "DEAD PATTERN. Free HR software funded by insurance broker commissions. Structural failure mode: model requires
    operating as a licensed insurance broker in each state, which does not scale at venture speed. Zenefits was selling
    insurance without licences in multiple states. The compliance requirement scales linearly with geographic expansion,
    creating maximum friction at maximum growth. See boundary_cases for Zenefits/Rippling lineage."
- slug: compound-hr-it-finance-platform
  name: Compound HR + IT + Finance platform
  solution_pattern: compound-workforce-management-platform
  first_observed: 2016
  status: live
  business_model: Modular per-employee-per-month subscription
  pricing_signal: <100/mo
  notes: "Unified workforce OS built on a single employee record (Employee Graph) powering HR, IT, and Finance
    simultaneously. Employee data is the same across all three domains — storing it once eliminates integration cost and
    enables cross-module automation. New modules reach $1M ARR within 5-6 months of launch because data setup is already
    complete. Mechanism: workflow orchestration + abstraction. Moat: the Employee Graph itself — more modules adopted =
    higher switching cost. Capability required: unified data architecture from day one (cannot be bolted on)."
- slug: global-payroll-eor-platform
  name: Global payroll / Employer of Record platform
  solution_pattern: global-employment-infrastructure
  first_observed: 2016
  status: live
  business_model: Per-employee-per-month ($500-650 for EOR, lower for contractor)
  pricing_signal: <100/mo
  notes: "Technology-enabled EOR: platform acts as legal employer in each country, handling local compliance, payroll, and
    benefits on behalf of client companies. Two sub-models: (1) entity-ownership (Deel, Remote — own legal entities per
    country, higher margin control, slower expansion); (2) partner model (Papaya Global — partners with local providers,
    faster expansion, lower margin, weaker moat). Entity-ownership appears to be winning as of 2025. Status quo
    displaced: traditional EOR agencies charging 15%+ of payroll with high-touch, non-transparent pricing. Mechanism:
    coordination."
- slug: full-stack-payment-processor
  name: Full-stack payment processor
  solution_pattern: payment-processing-infrastructure
  first_observed: 1960
  status: live
  business_model: Interchange-plus processing fee (basis points on transaction value)
  pricing_signal: <100/mo
  notes: "Direct acquiring infrastructure with own card scheme connections, own bank
    sponsorship, own settlement infrastructure. Higher margin than aggregator model
    (no intermediary margin). Higher regulatory burden: acquiring bank licence or
    sponsorship required per market. Adyen is the canonical modern instantiation.
    Mechanism: abstraction — abstracts full acquiring stack into single API and dashboard.
    Status quo displaced: fragmented acquiring banks + payment gateways + separate
    settlement banks. Distinct from developer-first-payment-api by customer segment
    (enterprise vs SMB/developer) and pricing model (IC++ vs blended rate)."

- slug: developer-first-payment-api
  name: Developer-first payment API
  solution_pattern: payment-processing-infrastructure
  first_observed: 2010
  status: live
  business_model: Blended rate processing fee (percentage + flat fee per transaction)
  pricing_signal: <100/mo
  notes: "API-first payment infrastructure targeting developers and startups. Key
    structural differentiator from full-stack processor: simplified blended-rate
    pricing (hides interchange complexity) and developer experience over enterprise
    account management. Initial distribution: bottom-up, word-of-mouth among developers.
    Stripe is the canonical instantiation. Mechanism: abstraction. Status quo displaced:
    PayPal redirect model, manual merchant account applications with weeks-long approval.
    Convergence with full-stack-payment-processor as companies mature: Stripe now also
    competes for enterprise customers using IC++ pricing."

- slug: domestic-payment-infrastructure
  name: Domestic payment infrastructure platform
  solution_pattern: payment-processing-infrastructure
  first_observed: 2002
  status: live
  business_model: Transaction switching fee + card scheme licensing (Verve)
  pricing_signal: <100/mo
  notes: "National payment rails operator. Owns the switching infrastructure for
    domestic transactions within a single country or region. Distinct from full-stack
    global processor: depth (processes majority of one country's transactions) vs
    breadth (operates across many countries). Interswitch is the canonical Africa
    instantiation, processing ~90% of Nigeria's electronic transactions and operating
    the Verve domestic card scheme. Mechanism: standardisation — created a common
    switching infrastructure across banks that previously could not interoperate.
    Status quo displaced: manual interbank transfers, cash, paper cheques."

- slug: local-rail-aggregation
  name: Local payment rail aggregation
  solution_pattern: payment-processing-infrastructure
  first_observed: 2016
  status: live
  business_model: Transaction fee per payment method (1-3% of transaction value)
  pricing_signal: <100/mo
  notes: "Single API aggregating local payment methods (mobile money, bank transfers,
    cash networks, local card schemes) across multiple emerging markets. Core insight:
    merchants cannot integrate individually with each local rail in 40+ countries.
    Aggregator provides one technical and commercial relationship for all markets.
    dLocal (LatAm + Africa + Asia) and Flutterwave (Africa) are the primary instantiations.
    Two distinct sub-models within the same pattern: dLocal targets global enterprises
    entering emerging markets; Flutterwave targets African businesses moving money
    within and out of Africa. Mechanism: aggregation. Status quo displaced: per-country
    local banking relationships, each requiring separate engineering integration."

- slug: cross-border-a2a-infrastructure
  name: Cross-border account-to-account infrastructure
  solution_pattern: cross-border-payment-network
  first_observed: 2011
  status: live
  business_model: FX spread (percentage of converted amount plus small flat fee)
  pricing_signal: <100/mo
  notes: "International money movement via account-to-account transfers on local banking
    rails rather than card networks or correspondent banking. Structural advantage:
    holds local currency pools in sending and receiving countries, so transfers become
    two domestic transactions plus a currency conversion. Eliminates correspondent
    bank margin on each hop. Wise is the canonical instantiation. Mechanism: matching
    — matches senders and receivers of opposite currency pairs, enabling flow netting.
    Status quo displaced: bank wire transfers (2-5 days, 3-5% total cost), Western
    Union, MoneyGram. Profitable from early stage: FX spread revenue with no interchange
    cost."

- slug: accounts-payable-automation
  name: Accounts payable automation
  solution_pattern: payment-processing-infrastructure
  first_observed: 2006
  status: live
  business_model: Subscription (per business or per seat) plus transaction fee
  pricing_signal: 1k+/mo
  notes: "Software automating the supplier payment workflow: invoice receipt, approval
    routing, payment execution, reconciliation. Key distinction from payment acceptance
    infrastructure: the problem is disbursement (paying out) not acceptance (receiving
    in), and the bottleneck is the workflow (approval chains, invoice matching) not
    the payment rail itself. BILL is the canonical SMB instantiation. Mechanism:
    workflow orchestration. Status quo displaced: manual invoice processing via email
    + spreadsheets + bank portal."

- slug: payment-orchestration-layer
  name: Payment orchestration and ledger layer
  solution_pattern: payment-processing-infrastructure
  first_observed: 2018
  status: live
  business_model: Per-transaction fee or platform subscription
  pricing_signal: enterprise
  notes: "Software sitting above payment rails to manage operational complexity: ledger
    maintenance, reconciliation, approval workflows, payment routing. Critical distinction:
    does NOT hold or move money itself. All fund movement happens via bank integrations.
    Companies that hold money take on banking regulation; Modern Treasury explicitly
    avoids this — it is a software product, not a financial services product. This
    distinction is the lesson drawn from Synapse's failure. Mechanism: workflow
    orchestration. Status quo displaced: bespoke internal finance engineering, manual
    reconciliation in spreadsheets."

- slug: baas-middleware
  name: Banking-as-a-Service middleware
  solution_pattern: embedded-banking-infrastructure
  first_observed: 2018
  status: dead
  business_model: Per-transaction fee plus monthly platform fee
  pricing_signal: enterprise
  notes: "DEAD PATTERN. Middleware between sponsor banks and fintech companies, providing
    APIs abstracting the sponsor bank's infrastructure. Three-party structure: fintech
    to middleware (Synapse) to sponsor bank. Structural failure mode: middleware
    maintains its own ledger separately from the sponsor bank. When these ledgers
    diverge — as in Synapse's April 2024 bankruptcy — neither the bank nor the fintech
    can resolve the discrepancy. $85-160M in customer funds were frozen; former FDIC
    Chair appointed as bankruptcy trustee. FDIC proposed the Synapse rule in response.
    Pattern replaced by: direct bank partnership (eliminating middleware ledger), or
    direct bank charter acquisition. Status quo displaced: direct banking licence
    application, which takes 2-5 years."

- slug: direct-bank-partnership
  name: Direct bank partnership for embedded finance
  solution_pattern: embedded-banking-infrastructure
  first_observed: 2019
  status: live
  business_model: Per-account monthly fee plus interchange on card spend
  pricing_signal: enterprise
  notes: "The corrected implementation of embedded banking following the BaaS
    middleware failures (Synapse April 2024, Railsr October 2023). Structural
    distinction from baas-middleware: no middleware ledger. The fintech connects
    directly to a partner bank; the bank holds deposits and maintains the
    authoritative ledger. The infrastructure company (Unit, Treasury Prime,
    Synctera) provides compliance software, product tooling, and regulatory
    programme management without interposing its own ledger between fintech
    and bank. Eliminating the middleware ledger eliminates the reconciliation
    risk that destroyed Synapse. Synapse's bankruptcy directly accelerated market
    adoption: banks and fintechs refused three-party middleware architectures
    after 2024, shifting to this model. Mechanism: abstraction — same as
    baas-middleware, but the abstraction layer is software-only, not a ledger.
    Status quo displaced: direct banking licence application (2-5 years) and
    baas-middleware (now dead)."

- slug: agent-network-remittance
  name: Agent network remittance
  solution_pattern: cross-border-payment-network
  first_observed: 1871
  status: live
  business_model: Per-transaction fee (flat or percentage) plus FX spread
  pricing_signal: <100/mo
  notes: "The original cross-border money movement pattern. Physical agent locations
    (retail stores, post offices, pharmacies) act as cash-in and cash-out points.
    Sender deposits cash at origin agent; recipient collects cash at destination agent.
    Western Union is the canonical 150-year instantiation. Structural advantage over
    digital-first: reaches unbanked populations and rural geographies where smartphones
    and bank accounts are absent. Structural disadvantage: agent commission cost floor
    makes fee compression impossible beyond a point — exactly the opening Wise, Remitly,
    and LemFi exploited. Pattern is not dead: 700M+ people remain unbanked globally
    and agent networks are the only practical rail for many corridors. Mechanism:
    coordination — matches cash at origin to cash at destination via agent float.
    Status quo displaced: informal hawala networks, physical cash transport."

- slug: mobile-money-network
  name: Telco-owned mobile money network
  solution_pattern: cross-border-payment-network
  first_observed: 2007
  status: live
  business_model: Per-transaction fee (percentage of transfer value)
  pricing_signal: <100/mo
  notes: "Mobile money infrastructure owned and operated by a telecommunications company,
    using the telco's existing subscriber base and airtime distribution network as
    the distribution channel. Structurally distinct from both agent-network-remittance
    (no telco ownership, no SIM-based wallet) and cross-border-a2a-infrastructure
    (telco owns the rail rather than sitting on top of banking rails). M-Pesa (Safaricom,
    Kenya) is the canonical instantiation — launched 2007, reached profitability within
    3 years, now processes more transactions than Kenya's entire banking system.
    Key structural insight: telco already has billing infrastructure, agent network
    (airtime resellers), KYC from SIM registration, and daily customer touch. Payment
    is a zero-marginal-cost add-on to an existing distribution asset. Mechanism:
    aggregation — aggregates existing telco subscriber relationships into a payment
    network. Status quo displaced: bank branches (inaccessible to rural/unbanked),
    cash, informal transfers."
