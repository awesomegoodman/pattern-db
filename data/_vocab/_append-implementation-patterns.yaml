- slug: full-stack-payment-processor
  name: Full-stack payment processor
  solution_pattern: payment-processing-infrastructure
  first_observed: 1960
  status: live
  business_model: Interchange-plus processing fee (basis points on transaction value)
  pricing_signal: <100/mo
  notes: "Direct acquiring infrastructure with own card scheme connections, own bank
    sponsorship, own settlement infrastructure. Higher margin than aggregator model
    (no intermediary margin). Higher regulatory burden: acquiring bank licence or
    sponsorship required per market. Adyen is the canonical modern instantiation.
    Mechanism: abstraction — abstracts full acquiring stack into single API and dashboard.
    Status quo displaced: fragmented acquiring banks + payment gateways + separate
    settlement banks. Distinct from developer-first-payment-api by customer segment
    (enterprise vs SMB/developer) and pricing model (IC++ vs blended rate)."

- slug: developer-first-payment-api
  name: Developer-first payment API
  solution_pattern: payment-processing-infrastructure
  first_observed: 2010
  status: live
  business_model: Blended rate processing fee (percentage + flat fee per transaction)
  pricing_signal: <100/mo
  notes: "API-first payment infrastructure targeting developers and startups. Key
    structural differentiator from full-stack processor: simplified blended-rate
    pricing (hides interchange complexity) and developer experience over enterprise
    account management. Initial distribution: bottom-up, word-of-mouth among developers.
    Stripe is the canonical instantiation. Mechanism: abstraction. Status quo displaced:
    PayPal redirect model, manual merchant account applications with weeks-long approval.
    Convergence with full-stack-payment-processor as companies mature: Stripe now also
    competes for enterprise customers using IC++ pricing."

- slug: domestic-payment-infrastructure
  name: Domestic payment infrastructure platform
  solution_pattern: payment-processing-infrastructure
  first_observed: 2002
  status: live
  business_model: Transaction switching fee + card scheme licensing (Verve)
  pricing_signal: <100/mo
  notes: "National payment rails operator. Owns the switching infrastructure for
    domestic transactions within a single country or region. Distinct from full-stack
    global processor: depth (processes majority of one country's transactions) vs
    breadth (operates across many countries). Interswitch is the canonical Africa
    instantiation, processing ~90% of Nigeria's electronic transactions and operating
    the Verve domestic card scheme. Mechanism: standardisation — created a common
    switching infrastructure across banks that previously could not interoperate.
    Status quo displaced: manual interbank transfers, cash, paper cheques."

- slug: local-rail-aggregation
  name: Local payment rail aggregation
  solution_pattern: payment-processing-infrastructure
  first_observed: 2016
  status: live
  business_model: Transaction fee per payment method (1-3% of transaction value)
  pricing_signal: <100/mo
  notes: "Single API aggregating local payment methods (mobile money, bank transfers,
    cash networks, local card schemes) across multiple emerging markets. Core insight:
    merchants cannot integrate individually with each local rail in 40+ countries.
    Aggregator provides one technical and commercial relationship for all markets.
    dLocal (LatAm + Africa + Asia) and Flutterwave (Africa) are the primary instantiations.
    Two distinct sub-models within the same pattern: dLocal targets global enterprises
    entering emerging markets; Flutterwave targets African businesses moving money
    within and out of Africa. Mechanism: aggregation. Status quo displaced: per-country
    local banking relationships, each requiring separate engineering integration."

- slug: cross-border-a2a-infrastructure
  name: Cross-border account-to-account infrastructure
  solution_pattern: cross-border-payment-network
  first_observed: 2011
  status: live
  business_model: FX spread (percentage of converted amount plus small flat fee)
  pricing_signal: <100/mo
  notes: "International money movement via account-to-account transfers on local banking
    rails rather than card networks or correspondent banking. Structural advantage:
    holds local currency pools in sending and receiving countries, so transfers become
    two domestic transactions plus a currency conversion. Eliminates correspondent
    bank margin on each hop. Wise is the canonical instantiation. Mechanism: matching
    — matches senders and receivers of opposite currency pairs, enabling flow netting.
    Status quo displaced: bank wire transfers (2-5 days, 3-5% total cost), Western
    Union, MoneyGram. Profitable from early stage: FX spread revenue with no interchange
    cost."

- slug: accounts-payable-automation
  name: Accounts payable automation
  solution_pattern: payment-processing-infrastructure
  first_observed: 2006
  status: live
  business_model: Subscription (per business or per seat) plus transaction fee
  pricing_signal: 1k+/mo
  notes: "Software automating the supplier payment workflow: invoice receipt, approval
    routing, payment execution, reconciliation. Key distinction from payment acceptance
    infrastructure: the problem is disbursement (paying out) not acceptance (receiving
    in), and the bottleneck is the workflow (approval chains, invoice matching) not
    the payment rail itself. BILL is the canonical SMB instantiation. Mechanism:
    workflow orchestration. Status quo displaced: manual invoice processing via email
    + spreadsheets + bank portal."

- slug: payment-orchestration-layer
  name: Payment orchestration and ledger layer
  solution_pattern: payment-processing-infrastructure
  first_observed: 2018
  status: live
  business_model: Per-transaction fee or platform subscription
  pricing_signal: enterprise
  notes: "Software sitting above payment rails to manage operational complexity: ledger
    maintenance, reconciliation, approval workflows, payment routing. Critical distinction:
    does NOT hold or move money itself. All fund movement happens via bank integrations.
    Companies that hold money take on banking regulation; Modern Treasury explicitly
    avoids this — it is a software product, not a financial services product. This
    distinction is the lesson drawn from Synapse's failure. Mechanism: workflow
    orchestration. Status quo displaced: bespoke internal finance engineering, manual
    reconciliation in spreadsheets."

- slug: baas-middleware
  name: Banking-as-a-Service middleware
  solution_pattern: embedded-banking-infrastructure
  first_observed: 2018
  status: dead
  business_model: Per-transaction fee plus monthly platform fee
  pricing_signal: enterprise
  notes: "DEAD PATTERN. Middleware between sponsor banks and fintech companies, providing
    APIs abstracting the sponsor bank's infrastructure. Three-party structure: fintech
    to middleware (Synapse) to sponsor bank. Structural failure mode: middleware
    maintains its own ledger separately from the sponsor bank. When these ledgers
    diverge — as in Synapse's April 2024 bankruptcy — neither the bank nor the fintech
    can resolve the discrepancy. $85-160M in customer funds were frozen; former FDIC
    Chair appointed as bankruptcy trustee. FDIC proposed the Synapse rule in response.
    Pattern replaced by: direct bank partnership (eliminating middleware ledger), or
    direct bank charter acquisition. Status quo displaced: direct banking licence
    application, which takes 2-5 years."
